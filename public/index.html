  <div class="loading-box">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中…</div>
  </div>
</div>

<script>
  // 页面加载完成，立即关闭原生加载弹窗
  if (window.qnetAndroidObj) {
    window.qnetAndroidObj.callAndroidApi({api: 'close_loading'});
  }

  // ===== 访问统计：记录设备ID和访问人数 =====
  let deviceId = localStorage.getItem('qxnet_device_id');
  if (!deviceId) {
    deviceId = 'dev_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    localStorage.setItem('qxnet_device_id', deviceId);
  }
  sb.from('visits').insert({ device_id: deviceId }).then(() => {});
  document.getElementById('deviceIdLabel').textContent = '设备ID: ' + deviceId;

  // ===== 状态 =====
  const state = {
    tab: 'login',
    pwdVisible: false,
    cardKeyVisible: false,
  };

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const tabs = document.querySelectorAll('.tab-btn');
  const heroBadge = $('heroBadge');
  const heroTitle = $('heroTitle');
  const heroTip = $('heroTip');
  const accountFields = $('accountFields');
  const messagePanel = $('messagePanel');
  const cardKeyField = $('cardKeyField');
  const rememberRow = $('rememberRow');
  const passwordLabel = $('passwordLabel');
  const submitBtn = $('submitBtn');
  const toastEl = $('toastEl');
  const pwdLoginBtn = $('pwdLoginBtn');
  const otpLoginBtn = $('otpLoginBtn');
  const clearBtn = $('clearBtn');
  const getOtpBtn = $('getOtpBtn');
  const togglePwdBtn = $('togglePwdBtn');
  const toggleCardKeyBtn = $('toggleCardKeyBtn');

  // ===== Toast（提前定义） =====
  let toastTimer;
  function showToast(text) {
    if (!toastEl) return;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // ===== Loading 弹窗（提前定义） =====
  const loadingModal = $('loadingModal');
  function showLoading(text = '加载中…') {
    if (!loadingModal) return;
    loadingModal.querySelector('.loading-text').textContent = text;
    loadingModal.classList.add('show');
  }
  function hideLoading() {
    if (!loadingModal) return;
    loadingModal.classList.remove('show');
  }

  // ===== 登录方式切换（提前绑定） =====
  state.loginType = 'otp';

  if (pwdLoginBtn) {
    pwdLoginBtn.addEventListener('click', (e) => {
      e.preventDefault();
      state.loginType = 'pwd';
      pwdLoginBtn.style.background = '#EFF6FF';
      pwdLoginBtn.style.color = '#3B82F6';
      pwdLoginBtn.style.fontWeight = '600';
      otpLoginBtn.style.background = '#fff';
      otpLoginBtn.style.color = '#0F172A';
      otpLoginBtn.style.fontWeight = '400';
      $('passwordField').classList.remove('hidden');
      $('otpField').classList.add('hidden');
      $('accountLabel').textContent = '账号';
      $('accountInput').placeholder = '用户名或邮箱';
    });
  }

  if (otpLoginBtn) {
    otpLoginBtn.addEventListener('click', (e) => {
      e.preventDefault();
      state.loginType = 'otp';
      otpLoginBtn.style.background = '#EFF6FF';
      otpLoginBtn.style.color = '#3B82F6';
      otpLoginBtn.style.fontWeight = '600';
      pwdLoginBtn.style.background = '#fff';
      pwdLoginBtn.style.color = '#0F172A';
      pwdLoginBtn.style.fontWeight = '400';
      $('passwordField').classList.add('hidden');
      $('otpField').classList.remove('hidden');
      $('accountLabel').textContent = '邮箱';
      $('accountInput').placeholder = '请输入邮箱';
    });
  }

  // ===== 清除按钮 =====
  if (clearBtn) {
    clearBtn.addEventListener('click', (e) => {
      e.preventDefault();
      $('accountInput').value = '';
      showToast('已清除');
    });
  }

  // ===== 获取验证码按钮 =====
  let cooldown = 0;
  if (getOtpBtn) {
    getOtpBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      if (cooldown > 0) return;
      const email = $('accountInput').value.trim();
      if (!email || !email.includes('@')) return showToast('请输入正确的邮箱');
      showLoading('发送验证码中…');
      const { error } = await sb.auth.signInWithOtp({ email });
      hideLoading();
      if (error) {
        showToast('发送失败，请重试');
      } else {
        showToast('验证码已发送');
        cooldown = 60;
        const btn = $('getOtpBtn');
        btn.textContent = `${cooldown}秒后重发`;
        const timer = setInterval(() => {
          cooldown--;
          if (cooldown <= 0) {
            btn.textContent = '获取验证码';
            clearInterval(timer);
          } else {
            btn.textContent = `${cooldown}秒后重发`;
          }
        }, 1000);
      }
    });
  }

  // ===== 显示/隐藏密码 =====
  if (togglePwdBtn) {
    togglePwdBtn.addEventListener('click', (e) => {
      e.preventDefault();
      state.pwdVisible = !state.pwdVisible;
      const input = $('passwordInput');
      input.type = state.pwdVisible ? 'text' : 'password';
      togglePwdBtn.textContent = state.pwdVisible ? '隐藏' : '显示';
    });
  }

  // ===== 显示/隐藏卡密 =====
  if (toggleCardKeyBtn) {
    toggleCardKeyBtn.addEventListener('click', (e) => {
      e.preventDefault();
      state.cardKeyVisible = !state.cardKeyVisible;
      const input = $('cardKeyInput');
      input.type = state.cardKeyVisible ? 'text' : 'password';
      toggleCardKeyBtn.textContent = state.cardKeyVisible ? '隐藏' : '显示';
    });
  }

  // ===== 提交按钮（提前绑定） =====
  if (submitBtn) {
    submitBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const acc = $('accountInput').value.trim();

      if (state.tab === 'login') {
        if (!acc) return showToast('请输入账号');

        if (state.loginType === 'pwd') {
          // 密码登录
          const pwd = $('passwordInput').value.trim();
          if (!pwd) return showToast('请输入密码');
          showLoading('登录中…');
          let email = acc;
          if (!email.includes('@')) email = acc + '@qxnet.com';
          const { data, error } = await sb.auth.signInWithPassword({
            email: email,
            password: pwd,
          });
          if (error) {
            hideLoading();
            if (error.message.includes('Invalid login credentials')) showToast('账号或密码错误');
            else if (error.message.includes('Email not confirmed')) showToast('请先验证邮箱');
            else showToast('登录失败，请重试');
          } else {
            const expiresAt = data.user.user_metadata?.expires_at ? new Date(data.user.user_metadata.expires_at) : null;
            if (expiresAt && expiresAt < new Date()) {
              hideLoading();
              showToast('授权已过期');
            } else {
              hideLoading();
              showToast('登录成功');
              if (window.qnetAndroidObj) {
                window.qnetAndroidObj.callAndroidApi({api: 'close_loading'});
              }
            }
          }
        } else {
          // 验证码登录
          const token = $('otpInput').value.trim();
          if (!acc.includes('@')) return showToast('验证码登录请输入邮箱');
          if (!token || token.length !== 6) return showToast('请输入6位验证码');
          showLoading('登录中…');
          const { data, error } = await sb.auth.verifyOtp({
            email: acc,
            token: token,
            type: 'email',
          });
          if (error) {
            hideLoading();
            showToast('验证码错误或已过期');
          } else {
            const expiresAt = data.user.user_metadata?.expires_at ? new Date(data.user.user_metadata.expires_at) : null;
            if (expiresAt && expiresAt < new Date()) {
              hideLoading();
              showToast('授权已过期');
            } else {
              hideLoading();
              showToast('登录成功');
              if (window.qnetAndroidObj) {
                window.qnetAndroidObj.callAndroidApi({api: 'close_loading'});
              }
            }
          }
        }
      } else if (state.tab === 'register') {
        // 注册：邮箱 + 密码 + 卡密
        const pwd = $('passwordInput').value.trim();
        const card = $('cardKeyInput').value.trim();
        if (!acc || !acc.includes('@')) return showToast('请输入正确的邮箱');
        if (pwd.length < 8) return showToast('密码需 8 位及以上');
        if (!card) return showToast('请输入卡密 / 授权码');
        showLoading('验证卡密中…');
        const { data: cardData, error: cardError } = await sb
          .from('cards')
          .select('*')
          .eq('card_key', card)
          .eq('used', false)
          .single();
        if (cardError || !cardData) {
          hideLoading();
          return showToast('卡密无效或已使用');
        }
        showLoading('注册中…');
        let days = 36500;
        if (cardData.type === 'day') days = 1;
        else if (cardData.type === 'week') days = 7;
        else if (cardData.type === 'month') days = 30;
        else if (cardData.type === 'quarter') days = 90;
        else if (cardData.type === 'lifetime') days = 36500;
        const expiresAt = new Date();
        expiresAt.setDate(expiresAt.getDate() + days);
        const { data, error } = await sb.auth.signUp({
          email: acc,
          password: pwd,
          options: {
            data: {
              card_key: card,
              expires_at: expiresAt.toISOString()
            }
          }
        });
        if (error) {
          hideLoading();
          if (error.message.includes('User already registered')) showToast('该邮箱已注册');
          else showToast('注册失败，请重试');
        } else {
          await sb
            .from('cards')
            .update({ used: true })
            .eq('card_key', card);
          hideLoading();
          showToast('注册成功');
        }
      } else {
        window.location.href = 'https://shop.qmmpay.com/shop/TENXQ';
      }
    });
  }

  // ===== 粘贴卡密时自动清理无用内容 =====
  const cardKeyInput = $('cardKeyInput');
  cardKeyInput.addEventListener('paste', (e) => {
    e.preventDefault();
    let text = (e.clipboardData || window.clipboardData).getData('text');
    // 自动提取 QXNET- 开头的卡密
    const match = text.match(/QXNET-[A-Z0-9]+/i);
    if (match) {
      cardKeyInput.value = match[0];
    } else {
      cardKeyInput.value = text.trim();
    }
    // 光标移到最后面
    setTimeout(() => {
      cardKeyInput.setSelectionRange(cardKeyInput.value.length, cardKeyInput.value.length);
    }, 0);
  });

  // ===== Tab 切换 =====
  const MARQUEE_TEXT = '原汁原味的QNET2.1.5版本，实现了原版的地区延迟计算。';
  const tabConfig = {
    login: {
      badge: '登录',
      title: 'QXNet 智能弱网控制台',
      tip: MARQUEE_TEXT,
      submit: '进入 QNET',
      showAccount: true,
      showCardKey: false,
      showRemember: true,
    },
    register: {
      badge: '注册',
      title: '创建你的账号',
      tip: MARQUEE_TEXT,
      submit: '注册并进入',
      showAccount: true,
      showCardKey: true,
      showRemember: true,
    },
    message: {
      badge: '购买',
      title: '购买 QXNET 授权',
      tip: MARQUEE_TEXT,
      submit: '立即购买',
      showAccount: false,
      showCardKey: false,
      showRemember: false,
    },
  };

  function setMarquee(text) {
    // 复制两份实现无缝滚动
    heroTip.innerHTML = text + '&nbsp;&nbsp;&nbsp;&nbsp;' + text + '&nbsp;&nbsp;&nbsp;&nbsp;';
    // 重置动画
    heroTip.style.animation = 'none';
    void heroTip.offsetWidth;
    heroTip.style.animation = '';
  }

  function switchTab(tab) {
    state.tab = tab;
    const cfg = tabConfig[tab];

    tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    heroBadge.textContent = cfg.badge;
    heroTitle.textContent = cfg.title;
    submitBtn.textContent = cfg.submit;

    accountFields.classList.toggle('hidden', !cfg.showAccount);
    messagePanel.classList.toggle('hidden', cfg.showAccount);
    cardKeyField.classList.toggle('hidden', !cfg.showCardKey);

    // 控制登录方式切换和输入框显示
    if (tab === 'login') {
      $('loginTypeField').classList.remove('hidden');
      // 根据当前登录方式显示对应的输入框
      if (state.loginType === 'pwd') {
        $('passwordField').classList.remove('hidden');
        $('otpField').classList.add('hidden');
        $('accountLabel').textContent = '账号';
        $('accountInput').placeholder = '用户名或邮箱';
      } else {
        $('passwordField').classList.add('hidden');
        $('otpField').classList.remove('hidden');
        $('accountLabel').textContent = '邮箱';
        $('accountInput').placeholder = '请输入邮箱';
      }
    } else if (tab === 'register') {
      $('loginTypeField').classList.add('hidden');
      $('passwordField').classList.remove('hidden');
      $('otpField').classList.add('hidden');
      $('accountLabel').textContent = '邮箱';
      $('accountInput').placeholder = '请输入邮箱';
    }

    playDropAnimation();
  }

  // ===== 落下动画：从左上到右下依次 stagger =====
  function playDropAnimation() {
    // 收集当前可见的可动画元素（从上到下顺序）
    const animTargets = [];
    if (!accountFields.classList.contains('hidden')) {
      accountFields.querySelectorAll('.field').forEach(f => {
        if (!f.classList.contains('hidden')) animTargets.push(f);
      });
      if (!rememberRow.classList.contains('hidden')) animTargets.push(rememberRow);
    }
    if (!messagePanel.classList.contains('hidden')) {
      messagePanel.querySelectorAll('.field').forEach(f => animTargets.push(f));
    }
    animTargets.push(submitBtn);

    // 先清掉所有动画类，强制重绘后再加回来
    animTargets.forEach(el => el.classList.remove('drop-anim'));
    void document.body.offsetWidth; // 触发重绘
    animTargets.forEach((el, i) => {
      el.classList.add('drop-anim');
      el.setAttribute('data-delay', Math.min(i, 5));
    });
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // 初始化显示登录页
  switchTab('login');

  // ===== 套餐选择 =====
  const planItems = document.querySelectorAll('.plan-item');
  const planStyles = {
    selected: { border: '2px solid #3B82F6', background: '#EFF6FF', titleColor: '#1E40AF', priceColor: '#2563EB' },
    normal:   { border: '2px solid #E2E8F0', background: 'transparent', titleColor: '#0F172A', priceColor: '#0F172A' },
  };
  function selectPlan(el) {
    planItems.forEach(item => {
      const isSel = item === el;
      const s = isSel ? planStyles.selected : planStyles.normal;
      item.style.border = s.border;
      item.style.background = s.background;
      item.style.boxShadow = isSel ? '0 4px 14px rgba(59, 130, 246, 0.15)' : 'none';
      item.style.transform = isSel ? 'translateY(-2px)' : 'translateY(0)';
      item.querySelector('div div:first-child').style.color = s.titleColor;
      item.querySelector('div:last-child').style.color = s.priceColor;
      item.classList.toggle('selected', isSel);
    });
  }
  planItems.forEach(item => {
    item.addEventListener('click', () => selectPlan(item));
  });

  // ===== 提交 =====

</script>

</body>
</html>
