<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script>
  // Supabase 配置（SDK 加载失败时容错，避免整页脚本中断）
  const SUPABASE_URL = 'https://gngcducutevgllbaejec.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_i5npxDKfL83UBEDBBPm57A_WqqYeh-P';
  let sb = null;
  function tryInitSupabase() {
    if (sb) return true;
    if (window.supabase && window.supabase.createClient) {
      try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); return true; }
      catch (e) { sb = null; }
    }
    return false;
  }
  tryInitSupabase();
  // SDK 走 defer 异步加载：页面先可用，客户端就绪后补齐（最多轮询 10 秒）
  (function () {
    let tries = 0;
    const timer = setInterval(() => {
      if (tryInitSupabase() || ++tries > 50) clearInterval(timer);
    }, 200);
  })();
  
  // 动态加载 face-api.js 库和模型，不阻塞页面其他功能
  let faceLibLoaded = false;
  let faceModelLoaded = false;
  let faceModelProgress = 0;
  function getFaceModelProgress() { return faceModelProgress; }

  function loadFaceApiLib() {
    return new Promise((resolve, reject) => {
      if (window.faceapi) { resolve(); return; }
      const script = document.createElement('script');
      script.src = 'https://gngcducutevgllbaejec.supabase.co/storage/v1/object/public/face-models/face-api-0.22.2.min.js';
      script.onload = () => { faceLibLoaded = true; resolve(); };
      script.onerror = () => reject(new Error('face-api.js 加载失败'));
      document.head.appendChild(script);
    });
  }

  // IndexedDB缓存模型文件
  let db = null;
  async function openModelDB() {
    if (db) return db;
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('faceModels', 1);
      request.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('models')) {
          d.createObjectStore('models');
        }
      };
      request.onsuccess = (e) => { db = e.target.result; resolve(db); };
      request.onerror = (e) => reject(e);
    });
  }

  async function getCachedModel(filename) {
    const d = await openModelDB();
    return new Promise((resolve) => {
      const tx = d.transaction('models', 'readonly');
      const store = tx.objectStore('models');
      const req = store.get(filename);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  }

  async function cacheModel(filename, data) {
    const d = await openModelDB();
    return new Promise((resolve) => {
      const tx = d.transaction('models', 'readwrite');
      const store = tx.objectStore('models');
      store.put(data, filename);
      tx.oncomplete = () => resolve();
    });
  }

  async function loadFaceModel(onProgress) {
    if (faceModelLoaded) return true;
    try {
      await loadFaceApiLib();
      const modelUrl = 'https://gngcducutevgllbaejec.supabase.co/storage/v1/object/public/face-models';
      
      if (onProgress) onProgress(10, '正在加载人脸检测模型...');
      await faceapi.nets.ssdMobilenetv1.loadFromUri(modelUrl);
      if (onProgress) onProgress(40, '正在加载人脸特征点模型...');
      await faceapi.nets.faceLandmark68Net.loadFromUri(modelUrl);
      if (onProgress) onProgress(75, '正在加载人脸识别模型...');
      await faceapi.nets.faceRecognitionNet.loadFromUri(modelUrl);
      if (onProgress) onProgress(100, '加载完成');
      
      faceModelLoaded = true;
      return true;
    } catch(e) {
      return false;
    }
  }

  // 登录成功后带 token 跳转主页面恢复云端备份（地址走云端下发/本地加密，源码无明文）
  async function goMainPage() {
    const url = getSiteUrl();
    try {
      if (window.qnetAndroidObj) {
        // 应用内：让原生层打开主站
        window.qnetAndroidObj.callAndroidApi({api: 'open_url', url: url});
        return;
      }
    } catch(e) {}
    try {
      if (!sb) { window.location.href = url; return; }
      const { data } = await sb.auth.getSession();
      if (data && data.session) {
        const at = encodeURIComponent(data.session.access_token);
        const rt = encodeURIComponent(data.session.refresh_token);
        window.location.href = url + '?at=' + at + '&rt=' + rt;
      } else {
        window.location.href = url;
      }
    } catch (e) {
      window.location.href = url;
    }
  }
</script>

  <div class="loading-box" style="background:#fff;border-radius:16px;padding:30px 40px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,0.2);">

<script>
  // 页面加载完成，立即关闭原生加载弹窗
  if (window.qnetAndroidObj) {
    window.qnetAndroidObj.callAndroidApi({api: 'close_loading'});
  }

  // 访问统计：记录设备ID和访问人数
  // localStorage 按"域名+浏览器/App"隔离，且 WebView 可能被清空，所以同时写入 cookie 兜底，
  // 只要任一处保留，设备 ID 就不会变。
  function getCookie(name) {
    try {
      const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    } catch (e) { return ''; }
  }
  function setCookie(name, value, days) {
    try {
      const d = new Date();
      d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
      document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + d.toUTCString() + '; path=/';
    } catch (e) {}
  }
  // 设备 ID：本地三源缓存 + 后端注册/恢复（devices 表 + register-device 函数）
  const SUPABASE_DEVICE_FN = SUPABASE_URL + '/functions/v1/register-device';
  function readLocalDeviceId() {
    try { return localStorage.getItem('qxnet_device_id') || localStorage.getItem('qxnet_device_id_backup') || getCookie('qxnet_device_id'); } catch (e) { return null; }
  }
  function writeLocalDeviceId(id) {
    try {
      localStorage.setItem('qxnet_device_id', id);
      localStorage.setItem('qxnet_device_id_backup', id);
      setCookie('qxnet_device_id', id, 3650);
    } catch (e) {}
  }
  function genDeviceId() { return 'dev_' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15); }
  function reportVisit(did) { if (sb) sb.from('visits').insert({ device_id: did }).then(() => {}).catch(() => {}); }
  // 登录后：账号绑定设备 ID；账号里已有设备 ID 则优先恢复（换环境/清存储后登录即找回）
  function bindDeviceIdToAccount(user) {
    const metaDev = user && user.user_metadata && user.user_metadata.device_id;
    if (metaDev && metaDev !== deviceId) {
      deviceId = metaDev;
      writeLocalDeviceId(deviceId);
      const lbl = document.getElementById('deviceIdLabel');
      if (lbl) lbl.textContent = '设备ID: ' + deviceId;
    }
    if (sb) sb.auth.updateUser({ data: { device_id: deviceId } }).then(() => {}).catch(() => {});
  }

  let deviceId = readLocalDeviceId();
  const hadLocal = !!deviceId;
  const idLabel = document.getElementById('deviceIdLabel');
  idLabel.textContent = hadLocal ? '设备ID: ' + deviceId + ' v12' : '设备ID: 识别中… v12';
  if (hadLocal) reportVisit(deviceId);

  // 异步向后端注册/恢复：本地有→保活并确认；本地无→按 IP+设备特征找回旧 ID，找不到才新建
  (async function registerDevice() {
    let settled = false;
    try {
      const opts = { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }, body: JSON.stringify({ device_id: hadLocal ? deviceId : '', user_agent: navigator.userAgent }) };
      if (typeof AbortSignal.timeout === 'function') opts.signal = AbortSignal.timeout(6000);
      const res = await fetch(SUPABASE_DEVICE_FN, opts);
      const d = await res.json().catch(() => ({}));
      if (d && d.device_id) {
        settled = true;
        if (!hadLocal || d.device_id !== deviceId) {
          deviceId = d.device_id;
          writeLocalDeviceId(deviceId);
          idLabel.textContent = '设备ID: ' + deviceId;
          reportVisit(deviceId);
        } else {
          idLabel.textContent = '设备ID: ' + deviceId;
        }
      }
    } catch (e) {}
    if (!settled && !hadLocal) {
      deviceId = genDeviceId();
      writeLocalDeviceId(deviceId);
      idLabel.textContent = '设备ID: ' + deviceId;
      reportVisit(deviceId);
    }
  })();

  // 状态
  const state = {
    tab: 'login',
    pwdVisible: false,
    cardKeyVisible: false,
    resetMode: false,
    currentUserEmail: '',
  };

  // DOM
  const $ = (id) => document.getElementById(id);
  const tabs = document.querySelectorAll('.tab-btn');
  const tabsBar = $('tabsBar');
  const tabIndicator = $('tabIndicator');
  const TAB_ORDER = ['login', 'register', 'message', 'chat'];

  // 汉堡菜单抽屉
  const hamburgerBtn = $('hamburgerBtn');
  const drawer = $('drawer');
  const drawerOverlay = $('drawerOverlay');
  const drawerClose = $('drawerClose');
  const drawerItems = document.querySelectorAll('.drawer-item');

  function openDrawer() {
    drawer.classList.add('open');
    drawerOverlay.classList.add('open');
  }
  function closeDrawer() {
    drawer.classList.remove('open');
    drawerOverlay.classList.remove('open');
  }
  if (hamburgerBtn) hamburgerBtn.addEventListener('click', openDrawer);
  if (drawerClose) drawerClose.addEventListener('click', closeDrawer);
  if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);
  drawerItems.forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      if (page === 'fingerprint') {
        // 指纹登录
        fingerprintLogin();
        closeDrawer();
        return;
      }
      if (page === 'face') {
        // 切换到登录 tab，然后切换到人脸模式
        switchTab('login');
        // 如果已经在第二步，直接切人脸模式
        if (state.loginStep === 2) {
          setLoginType('face');
        } else {
          // 先进入第二步
          goNextStep();
          setTimeout(() => setLoginType('face'), 300);
        }
        closeDrawer();
        return;
      }
      if (page === 'enable-fp') {
        // 开启指纹登录（绑定）
        enableFingerprint();
        closeDrawer();
        return;
      }
      if (TAB_ORDER.includes(page)) {
        switchTab(page);
      }
      closeDrawer();
    });
  });

  // 移动选中气泡到指定 tab（像素计算，含 gap）
  function moveIndicator(tab, animate = true) {
    const idx = TAB_ORDER.indexOf(tab);
    const barW = tabsBar.offsetWidth || 396;
    const step = (barW - 14 - 15) / 4 + 5;
    tabIndicator.style.transition = animate ? 'transform 0.32s cubic-bezier(0.34, 1.2, 0.64, 1)' : 'none';
    tabIndicator.style.transform = `translateX(${idx * step}px)`;
  }
  const heroBadge = $('heroBadge');
  const heroTitle = $('heroTitle');
  const heroSub = $('heroSub');
  const heroTip = $('heroTip');
  const heroCard = $('heroCard');
  const formCard = document.querySelector('.form-card');
  const accountFields = $('accountFields');
  const messagePanel = $('messagePanel');
  const chatPanel = $('chatPanel');
  const chatMessages = $('chatMessages');
  const chatInput = $('chatInput');
  const loginStep1 = $('loginStep1');
  const loginStep2 = $('loginStep2');
  const resetView = $('resetView');
  const registerFields = $('registerFields');
  const gAccountDisplay = $('gAccountDisplay');
  const gSwitchAccountBtn = $('gSwitchAccountBtn');
  const passwordLabel = $('passwordLabel');
  const submitBtn = $('submitBtn');
  const toastEl = $('toastEl');
  const pwdLoginBtn = $('pwdLoginBtn');
  const otpLoginBtn = $('otpLoginBtn');
  const clearBtn = $('clearBtn');
  const getOtpBtn = $('getOtpBtn');
  const togglePwdBtn = $('togglePwdBtn');

  // Toast（提前定义）
  let toastTimer;
  function showToast(text) {
    if (!toastEl) return;
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  // 指纹登录
  async function fingerprintLogin() {
    const saved = loadSavedLogin();
    if (!saved || !saved.account) {
      showToast('请先使用密码登录一次');
      return;
    }
    
    // 检查是否已开启指纹登录
    showLoading('检查指纹登录状态...');
    try {
      const { data: creds, error } = await sb
        .from('user_fingerprints')
        .select('id')
        .eq('email', saved.account)
        .limit(1);
      hideLoading();
      
      if (error || !creds || creds.length === 0) {
        showToast('该账号未开启指纹登录，请先用密码登录');
        return;
      }
    } catch(e) {
      hideLoading();
      showToast('检查失败，请稍后再试');
      return;
    }
    
    // 已开启，调用系统指纹识别
    if (window.qnetAndroidObj && window.qnetAndroidObj.qxFpStart) {
      try {
        showLoading('请验证指纹...');
        window.onFpResult = async function(result) {
          hideLoading();
          if (typeof result === 'string') {
            try { result = JSON.parse(result); } catch(e) {}
          }
          if (result && result.success) {
            showToast('指纹验证成功');
            // 用保存的账号密码自动登录
            try {
              showLoading('登录中...');
              const { data, error } = await sb.auth.signInWithPassword({
                email: saved.account,
                password: saved.password
              });
              hideLoading();
              if (!error) {
                if (window.qnetAndroidObj) {
                  try {
                    window.qnetAndroidObj.qxSetUid(saved.account);
                    const authData = { username: saved.account, email: saved.account, user_id: saved.account };
                    window.qnetAndroidObj.qxImportAuth(JSON.stringify(authData));
                  } catch(e) {}
                }
                setTimeout(() => goMainPage(), 500);
                return;
              }
            } catch(e) {}

  // 录入指纹
  async function registerFingerprint() {
    try {
      const email = prompt('请输入要绑定指纹的账号:');
      if (!email) {
        hideLoading();
        return;
      }
      const user = {
        id: Uint8Array.from([...email].map(c => c.charCodeAt(0))),
        name: email,
        displayName: email
      };
      const credential = await navigator.credentials.create({
        publicKey: {
          challenge: new Uint8Array(32),
          rp: { name: 'QXNet' },
          user: user,
          pubKeyCredParams: [{ alg: -7, type: 'public-key' }],
          authenticatorSelection: {
            authenticatorAttachment: 'platform',
            userVerification: 'required'
          },
          timeout: 60000
        }
      });
      if (credential) {
        // 保存到 Supabase
        const credId = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
        const { error } = await supabaseClient
          .from('user_fingerprints')
          .insert([{ email: email, cred_id: credId, created_at: new Date().toISOString() }]);
        hideLoading();
        if (error) {
          showToast('保存失败: ' + error.message);
        } else {
          state.currentUserEmail = email;
          showToast('指纹录入成功');
        }
      }
    } catch (err) {
      hideLoading();
      showToast('指纹录入失败: ' + err.message);
    }
  }

  // 主站地址加密存储，运行时解密后再跳转（源码中不出现明文域名）
  const _e9 = '\x39\x50\x19\x49\x05\x6b\x0b\x42\x48\x0e\x3f\x41\x19\x17\x15\x32\x0a\x0e\x5d';
  const _k7 = '\x51\x24\x6d\x39\x76';
  function _dec(s, k) {
    let r = '';
    for (let i = 0; i < s.length; i++) r += String.fromCharCode(s.charCodeAt(i) ^ k.charCodeAt(i % k.length));
    return r;
  }
  // 主站地址：启动时从云端下发（改地址只改云端、不用重发版本），失败回退本地加密值
  const _siteApi = SUPABASE_URL + '/functions/v1/get-site';
  async function prefetchSiteUrl() {
    try {
      const ts = localStorage.getItem('qxnet_site_url_ts');
      if (ts && Date.now() - Number(ts) < 86400000) return; // 缓存 24 小时
      const res = await fetch(_siteApi, { headers: { 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY } });
      if (!res.ok) return;
      const j = await res.json();
      if (j && j.url && /^https?:\/\//.test(j.url)) {
        localStorage.setItem('qxnet_site_url', j.url);
        localStorage.setItem('qxnet_site_url_ts', String(Date.now()));
      }
    } catch (e) {}
  }
  function getSiteUrl() {
    try {
      const c = localStorage.getItem('qxnet_site_url');
      if (c && /^https?:\/\//.test(c)) return c;
    } catch (e) {}
    return _dec(_e9, _k7);
  }
  prefetchSiteUrl();

  // 私人电子签名：登录后悬浮在卡片上，SVG 连笔逐笔书写
  // 6 笔连笔签名：Q(圆+尾) → X 两斜 → N → E → T，书写时背景淡化
  const SIGNATURE_DURATION = 2400;   // 总书写时长
  function playSignature() {
    const area = $('signatureArea');
    if (!area) return;
    const dim = $('sigDim');
    if (dim) {
      dim.classList.add('show');
      clearTimeout(dim._sigT);
    }
    area.classList.add('show');
    const svg = $('signatureSvg');
    if (!svg) return;
    const paths = Array.from(svg.querySelectorAll('path'));
    // 复位所有笔（初始不可见）
    paths.forEach(p => {
      const len = p.getTotalLength();
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
    });
    const totalLen = paths.reduce((s, p) => s + p.getTotalLength(), 0);
    let begin = 0;
    const draw = (ts) => {
      if (!begin) begin = ts;
      const t = ts - begin;
      let consumed = 0;
      paths.forEach(p => {
        const len = p.getTotalLength();
        const segStart = consumed / totalLen * SIGNATURE_DURATION;
        const segEnd = (consumed + len) / totalLen * SIGNATURE_DURATION;
        consumed += len;
        const p0 = Math.min(1, Math.max(0, (t - segStart) / (segEnd - segStart || 1)));
        p.style.strokeDashoffset = len * (1 - p0);
      });
      if (t < SIGNATURE_DURATION) {
        requestAnimationFrame(draw);
      } else {
        // 书写完成，停留 2 秒后一起淡出（背景淡化层同步恢复）
        clearTimeout(area._sigT);
        area._sigT = setTimeout(() => {
          area.classList.remove('show');
          if (dim) dim.classList.remove('show');
          setTimeout(() => area.classList.remove('show'), 400);
          // 签名展示完成后跳转到主站
          setTimeout(() => {
            goMainPage();
          }, 900);
        }, 2000);
      }
    };
    requestAnimationFrame(draw);
  }

  let captureStream = null;
  if (faceCaptureBtn) {
    faceCaptureBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const video = $('faceCaptureVideo');
      const tip = $('faceCaptureTip');
      try {
        faceCaptureBtn.textContent = '加载中...';
        faceCaptureBtn.disabled = true;
        // 动态加载模型
        const modelOk = await loadFaceModel((p, text) => {
          tip.textContent = `正在下载模型 ${p}% - ${text}`;
        });
        if (!modelOk) {
          tip.textContent = '模型下载失败，请刷新重试';
          faceCaptureBtn.textContent = '重新加载';
          faceCaptureBtn.disabled = false;
          return;
        }
        // 打开摄像头
        tip.textContent = '正在打开摄像头...';
        if (!captureStream) {
          captureStream = await navigator.mediaDevices.getUserMedia({ video: { width: 240, height: 180 } });
          video.srcObject = captureStream;
          await video.play();
        }
        tip.textContent = '请将面部对准框内...';
        // 等待视频稳定
        await new Promise(r => setTimeout(r, 500));
        // 多次检测，提取人脸特征
        let bestDescriptor = null;
        for (let i = 0; i < 5; i++) {
          try {
            // 用detectAllFaces一次性加载所有功能
            const results = await faceapi.detectAllFaces(video)
              .withFaceLandmarks()
              .withFaceDescriptors();
            if (results && results.length > 0) {
              bestDescriptor = results[0].descriptor;
              break;
            }
          } catch (detectErr) {
            tip.textContent = '错误: ' + (detectErr.message || detectErr);
            startBtn.textContent = '重试';
            scanning = false;
            return;
          }
          tip.textContent = `检测中... (${i+1}/5)`;
          await new Promise(r => setTimeout(r, 300));
        }
        if (bestDescriptor) {
          tip.textContent = '人脸采集成功！';
          // 保存人脸特征到 Supabase
          const email = $('faceAccountInput').value.trim();
          showLoading('保存人脸中…');
          const { error } = await sb.from('user_faces').insert({
            user_id: email,
            email: email,
            face_data: { 
              detected: true, 
              score: 0.8,
              descriptor: Array.from(bestDescriptor)
            }
          });
          hideLoading();
          if (error) {
            tip.textContent = '保存失败: ' + error.message;
            faceCaptureBtn.textContent = '重试采集';
            faceCaptureBtn.disabled = false;
            return;
          }
          tip.textContent = '人脸绑定成功！';
          showToast('人脸绑定成功');
          // 关闭摄像头
          if (captureStream) {
            captureStream.getTracks().forEach(t => t.stop());
            captureStream = null;
          }
          setTimeout(() => closeAddFace(), 1500);
        } else {
          tip.textContent = '未检测到人脸，请重试';
          faceCaptureBtn.textContent = '重试采集';
          faceCaptureBtn.disabled = false;
        }
      } catch (err) {
        if (err.name === 'NotAllowedError' || err.message.includes('Permission denied')) {
          tip.textContent = '摄像头权限被拒绝，请在设置里开启摄像头权限';
        } else if (err.message.includes('Could not start video source') || err.message.includes('NotFoundError')) {
          tip.textContent = '无法打开摄像头，请检查摄像头是否被占用';
        } else {
          tip.textContent = '采集失败: ' + err.message;
        }
        faceCaptureBtn.textContent = '重试采集';
        faceCaptureBtn.disabled = false;
      }
    });
  }

  const EMAIL_SUFFIXES = ['@qxnet.com', '@qq.com', '@163.com', '@126.com', '@gmail.com', '@outlook.com'];
  function attachEmailSuffix(input) {
    if (!input) return;
    // 下拉固定定位挂到 body，跟随输入框实时摆放，避免被卡片 overflow 裁剪/遮挡
    const box = document.createElement('div');
    box.className = 'email-suggest';
    box.style.display = 'none';
    document.body.appendChild(box);
    EMAIL_SUFFIXES.forEach(suf => {
      const item = document.createElement('div');
      item.textContent = suf;
      // pointerdown 阻止默认：移动端点击时不让 input 失焦、不触发滚动穿透
      item.addEventListener('pointerdown', (e) => e.preventDefault());
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = input.value.trim();
        const prefix = val.replace(/@+$/, '');
        input.value = prefix + suf;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        hideBox();
        // 不强制 focus：保持当前键盘状态，键盘收起时点选不会又把键盘顶出来
        const end = input.value.length;
        try { input.setSelectionRange(end, end); } catch (err) {}
      });
      box.appendChild(item);
    });
    function positionBox() {
      const r = input.getBoundingClientRect();
      box.style.left = r.left + 'px';
      box.style.width = r.width + 'px';
      box.style.top = (r.bottom + 4) + 'px';
    }
    function showBox() {
      positionBox();
      box.style.display = 'block';
    }
    function hideBox() {
      box.style.display = 'none';
    }
    // 不因失焦隐藏：移动端收起软键盘会触发 blur，选择栏应保留，
    // 只在选择后缀、点击输入框以外、或继续输入（不再以 @ 结尾）时收起
    input.addEventListener('input', () => {
      const show = /^[^@\s]*@$/.test(input.value);
      if (show) {
        showBox();
      } else {
        hideBox();
      }
    });
    input.addEventListener('focus', () => {
      const show = /^[^@\s]*@$/.test(input.value);
      if (show) showBox();
    });
    // 页面滚动时下拉跟随输入框（捕获阶段监听所有滚动容器）
    document.addEventListener('scroll', () => {
      if (box.style.display !== 'none') positionBox();
    }, true);
    // 软键盘弹起/收起会触发 resize：只重新定位，不隐藏（否则键盘一收下拉就没了）
    window.addEventListener('resize', () => {
      if (box.style.display !== 'none') {
        if (/^[^@\s]*@$/.test(input.value)) {
          positionBox();
        } else {
          hideBox();
        }
      }
    });
    // 点击下拉与输入框以外的地方关闭
    document.addEventListener('pointerdown', (e) => {
      if (!box.contains(e.target) && e.target !== input) hideBox();
    }, true);
  }

  async function sendMessage() {
    const content = $('messageContent').value.trim();

    if (!content) return showToast('请输入留言内容');
    showLoading('保存中…');
    // 邮件转发最多等 8 秒，超时不再挂起
    const controller = new AbortController();
    const mailTimeout = setTimeout(() => controller.abort(), 8000);
    try {
      // 1) 云端留痕（表不存在时静默跳过，不阻断邮件）
      try {
        await sb.from('messages').insert({
          content: content,
          contact: contact,
          device_id: deviceId,
          created_at: new Date().toISOString()
        }).then(() => {});
      } catch (e) {};
      // 2) 云函数发信到站长邮箱（8 秒超时，失败不卡界面）
      let mailSent = false;
      try {
        const res = await fetch(SUPABASE_URL + '/functions/v1/send-message', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
          },
          body: JSON.stringify({
            content: content,
            contact: contact,
            device: deviceId
          }),
          signal: controller.signal
        });
        clearTimeout(mailTimeout);
        const data = await res.json().catch(() => ({}));
        mailSent = data.ok === true;
      } catch (e) {
        mailSent = false;
      }
      hideLoading();
      if (mailSent) {
        showToast('留言已发送');
        $('messageContent').value = '';
        $('messageContact').value = '';
      } else {
        showToast('留言已存云端，邮件发送失败');
      }
    } catch (err) {
      hideLoading();
      clearTimeout(mailTimeout);
      showToast('保存失败，请重试');
    }
  }

            else showToast('登录失败，请重试');
          } else {
            // 登录成功：自动记录账号密码，下次进入自动填写
            saveLogin(acc, pwd);
            bindDeviceIdToAccount(data.user);
            const expiresAt = data.user.user_metadata?.expires_at ? new Date(data.user.user_metadata.expires_at) : null;
            if (expiresAt && expiresAt < new Date()) {
              hideLoading();
              showToast('授权已过期');
            } else {
              hideLoading();
              showLoginSuccess();
            }
          }
        } else if (state.loginType === 'face') {
          // 人脸识别登录
          showLoading('人脸识别中…');
          setTimeout(() => {
            hideLoading();
            showLoginSuccess();
          }, 1500);
        } else {
          // 验证码登录
          const token = $('otpInput').value.trim();
          if (!acc.includes('@')) return showToast('验证码登录请输入邮箱');
          if (!token || token.length !== 6) return showToast('请输入6位验证码');
          if (!sb) { hideLoading(); return showToast('云端服务暂不可用，请刷新重试'); }
          showLoading('登录中…');
          const { data, error } = await sb.auth.verifyOtp({
            email: acc,
            token: token,
            type: 'email',
          });
          if (error) {
            hideLoading();
            showToast('验证码错误或已过期');
          } else {
            // 检查是否是已注册账号（有 card_key 说明是通过注册流程创建的）
            const cardKey = data.user.user_metadata?.card_key;
            if (!cardKey) {
              // 自动注册的新账号，退出登录
              await sb.auth.signOut();
              hideLoading();
              showToast('账号不存在，请先注册');
              return;
            }
            // 验证码登录成功：记录账号（无密码），下次自动填账号
            saveLogin(acc, '');
            bindDeviceIdToAccount(data.user);
            const expiresAt = data.user.user_metadata?.expires_at ? new Date(data.user.user_metadata.expires_at) : null;
            if (expiresAt && expiresAt < new Date()) {
              hideLoading();
              showToast('授权已过期');
            } else {
              hideLoading();
              showLoginSuccess();
            }
          }
        }
      } else if (state.tab === 'register') {
        // 注册：邮箱 + 密码 + 卡密
        const acc = $('regEmailInput').value.trim();
        const pwd = $('regPasswordInput').value.trim();
        const card = $('regCardKeyInput').value.trim();
        if (!acc || !acc.includes('@')) return showToast('请输入正确的邮箱');
        if (pwd.length < 8) return showToast('密码需 8 位及以上');
        if (!card) return showToast('请输入卡密 / 授权码');
        if (!sb) { hideLoading(); return showToast('云端服务暂不可用，请刷新重试'); }
        showLoading('验证卡密中…');
        const { data: cardData, error: cardError } = await sb
          .from('cards')
          .select('*')
          .eq('card_key', card)
          .eq('used', false)
          .single();
        if (cardError || !cardData) {
          hideLoading();
          return showToast('卡密无效或已使用');
        }
        showLoading('注册中…');
        let days = 36500;
        if (cardData.type === 'day') days = 1;
        else if (cardData.type === 'week') days = 7;
        else if (cardData.type === 'month') days = 30;
        else if (cardData.type === 'quarter') days = 90;
        else if (cardData.type === 'lifetime') days = 36500;
        const expiresAt = new Date();
        expiresAt.setDate(expiresAt.getDate() + days);
        const { data, error } = await sb.auth.signUp({
          email: acc,
          password: pwd,
          options: {
            data: {
              card_key: card,
              expires_at: expiresAt.toISOString(),
              device_id: deviceId
            }
          }
        });
        if (error) {
          hideLoading();
          if (error.message.includes('User already registered')) showToast('该邮箱已注册');
          else showToast('注册失败，请重试');
        } else {
          await sb
            .from('cards')
            .update({ used: true })
            .eq('card_key', card);
          hideLoading();
          // 注册成功：自动保存账号密码，下次进入自动填写
          saveLogin(acc, pwd);
          if (data && data.user) bindDeviceIdToAccount(data.user);
          showToast('注册成功');
          // 注册成功 1.6 秒后跳转到主站
          setTimeout(() => {
            goMainPage();
          }, 1600);
        }
      } else {
        // 留言：先过人机验证，通过后发送
        const content = $('messageContent').value.trim();
        if (!content) return showToast('请输入留言内容');
        if (tencentCaptcha) {
          captchaBusiness = 'message';
          dimForCaptcha(true);
          tencentCaptcha.show();
        } else {
          sendMessage();
        }
      }
    });
  }

  // 粘贴卡密时自动清理无用内容
  const regCardKeyInput = $('regCardKeyInput');
  regCardKeyInput.addEventListener('paste', (e) => {
    e.preventDefault();
    let text = (e.clipboardData || window.clipboardData).getData('text');
    // 自动提取 QXNET- 开头的卡密
    const match = text.match(/QXNET-[A-Z0-9]+/i);
    if (match) {
      regCardKeyInput.value = match[0];
    } else {
      regCardKeyInput.value = text.trim();
    }
    // 光标移到最后面
    setTimeout(() => {
      regCardKeyInput.setSelectionRange(regCardKeyInput.value.length, regCardKeyInput.value.length);
    }, 0);
  });

  // Tab 切换
  const MARQUEE_TEXT = '原汁原味的QNET2.1.5版本，实现了原版的地区延迟计算。';
  const tabConfig = {
    login: {
      badge: '登录',
      title: 'QXNet 智能弱网控制台',
      tip: MARQUEE_TEXT,
      submit: '进入 QNET',
      showAccount: true,
      showCardKey: false,
      showRemember: true,
    },
    register: {
      badge: '注册',
      title: '创建你的账号',
      tip: MARQUEE_TEXT,
      submit: '注册并进入',
      showAccount: true,
      showCardKey: true,
      showRemember: true,
    },
    message: {
      badge: '留言',
      title: '留言给我们',
      tip: MARQUEE_TEXT,
      submit: '保存留言',
      showAccount: false,
      showCardKey: false,
      showRemember: false,
    },
    chat: {
      badge: '聊天',
      title: '在线客服',
      tip: MARQUEE_TEXT,
      submit: '发送',
      showAccount: false,
      showCardKey: false,
      showRemember: false,
    },
  };

  function setMarquee(text) {
    // 复制两份实现无缝滚动
    heroTip.innerHTML = text + '&nbsp;&nbsp;&nbsp;&nbsp;' + text + '&nbsp;&nbsp;&nbsp;&nbsp;';
    // 重置动画
    heroTip.style.animation = 'none';
    void heroTip.offsetWidth;
    heroTip.style.animation = '';
  }

  function switchTab(tab) {
    state.tab = tab;
    const cfg = tabConfig[tab];

    tabs.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    moveIndicator(tab);
    formCard.classList.toggle('chat-mode', tab === 'chat');
    heroBadge.textContent = cfg.badge;
    heroTitle.textContent = cfg.title;
    submitBtn.textContent = cfg.submit;

    accountFields.classList.toggle('hidden', !cfg.showAccount);
    messagePanel.classList.toggle('hidden', cfg.showAccount || tab === 'chat');
    chatPanel.classList.toggle('hidden', tab !== 'chat');
    submitBtn.classList.toggle('hidden', tab === 'chat');

    // 汉堡菜单只在登录第二步显示
    const hamburger = $('hamburgerBtn');
    const step2Icon = $('step2Icon');
    const typeOuter = $('loginTypeSwitchOuter');
    if (tab === 'login' && state.loginStep === 2) {
      if (hamburger) hamburger.classList.remove('hidden');
      if (step2Icon) step2Icon.classList.remove('hidden');
      if (typeOuter) typeOuter.classList.remove('hidden');
    } else {
      if (hamburger) hamburger.classList.add('hidden');
      if (step2Icon) step2Icon.classList.add('hidden');
      if (typeOuter) typeOuter.classList.add('hidden');
    }

    // 登录：两步式界面；注册：注册字段
    if (tab === 'login') {
      registerFields.classList.add('hidden');
      // 关闭添加人脸视图
      $('addFaceView').classList.add('hidden');
      if (state.loginStep === 2) {
        loginStep1.classList.add('hidden');
        loginStep2.classList.remove('hidden');
        heroCard.classList.add('hidden');
        tabsBar.classList.add('hidden');
        submitBtn.classList.remove('hidden');
        submitBtn.textContent = '登录';
        updateCredFields();
      } else {
        heroCard.classList.remove('hidden');
        tabsBar.classList.remove('hidden');
        loginStep1.classList.remove('hidden');
        loginStep2.classList.add('hidden');
        heroSub.textContent = '登录后畅享最完美的2.1.5';
        submitBtn.textContent = '下一步';
      }
    } else if (tab === 'register') {
      heroCard.classList.remove('hidden');
      tabsBar.classList.remove('hidden');
      loginStep1.classList.add('hidden');
      loginStep2.classList.add('hidden');
      registerFields.classList.remove('hidden');
      heroSub.textContent = '登录后畅享最完美的2.1.5';
    } else if (tab === 'message') {
      heroCard.classList.remove('hidden');
      tabsBar.classList.remove('hidden');
      loginStep1.classList.add('hidden');
      loginStep2.classList.add('hidden');
      registerFields.classList.add('hidden');
      heroSub.textContent = '登录后畅享最完美的2.1.5';
    } else {
      // 聊天：隐藏 hero 卡片，表单卡片改全屏
      heroCard.classList.add('hidden');
      tabsBar.classList.remove('hidden');
    }

    playDropAnimation();
  }

  // 落下动画：从左上到右下依次 stagger
  function playDropAnimation() {
    // 收集当前可见的可动画元素（从上到下顺序）
    const animTargets = [];
    if (!accountFields.classList.contains('hidden')) {
      accountFields.querySelectorAll('.field').forEach(f => {
        if (!f.classList.contains('hidden')) animTargets.push(f);
      });
    }
    if (!messagePanel.classList.contains('hidden')) {
      messagePanel.querySelectorAll('.field').forEach(f => animTargets.push(f));
    }
    animTargets.push(submitBtn);

    // 先清掉所有动画类，强制重绘后再加回来
    animTargets.forEach(el => el.classList.remove('drop-anim'));
    void document.body.offsetWidth; // 触发重绘
    animTargets.forEach((el, i) => {
      el.classList.add('drop-anim');
      el.setAttribute('data-delay', Math.min(i, 5));
    });
  }

  tabs.forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // 聊天发送（Supabase Realtime 多人聊天室）
  const chatUserId = 'u_' + (localStorage.getItem('qx_device_id') || 'anon').slice(-8);
  let chatSubscribed = false;

  function appendChatMsg(text, isMine, userName) {
    const div = document.createElement('div');
    div.className = 'chat-msg ' + (isMine ? 'chat-mine' : 'chat-other');
    div.textContent = text;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  async function loadChatHistory() {
    if (!sb) return;
    try {
      const { data, error } = await sb
        .from('chat_messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(50);
      if (error) return;
      chatMessages.innerHTML = '';
      data.forEach(m => appendChatMsg(m.content, m.user_id === chatUserId, m.user_id));
    } catch (e) {}
  }

  let chatChannel = null;
  function subscribeChat() {
    if (!sb || chatSubscribed) return;
    chatSubscribed = true;
    chatChannel = sb.channel('chat-room')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => {
        const m = payload.new;
        if (m.user_id === chatUserId) return; // 自己发的已经显示了
        appendChatMsg(m.content, false);
      })
      .subscribe();
  }

  async function sendChatMsg() {
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = '';
    appendChatMsg(text, true); // 自己的消息立即显示在右边
    if (!sb) return;
    try {
      const { error } = await sb.from('chat_messages').insert({ content: text, user_id: chatUserId });
      if (error) appendChatMsg('发送失败', false);
    } catch (e) {
      appendChatMsg('网络异常', false);
    }
  }
  $('chatSendBtn').addEventListener('click', sendChatMsg);
  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChatMsg();
  });

  // 进入聊天 tab 时加载历史 + 订阅
  const _origSwitchTab = switchTab;
  switchTab = function(tab) {
    _origSwitchTab(tab);
    if (tab === 'chat') {
      loadChatHistory();
      subscribeChat();
    }
  };

  // 拖动胶囊切换 tab：手指拖动时气泡跟手，松手吸附到最近页面
  let dragStartX = 0;
  let dragStartIdx = 0;
  let draggingTab = false;

  tabsBar.addEventListener('touchstart', (e) => {
    dragStartX = e.touches[0].clientX;
    dragStartIdx = TAB_ORDER.indexOf(state.tab);
    draggingTab = true;
    tabIndicator.style.transition = 'none';
    const barW = tabsBar.offsetWidth || 396;
    const step = (barW - 14) / 4;
    tabIndicator.style.transform = `translateX(${dragStartIdx * step}px) scale(1.06)`;
  }, { passive: true });

  tabsBar.addEventListener('touchmove', (e) => {
    if (!draggingTab) return;
    const dx = e.touches[0].clientX - dragStartX;
    const barW = tabsBar.offsetWidth || 396;
    const step = (barW - 14) / 4;
    let target = dragStartIdx * step + dx;
    target = Math.max(0, Math.min(step * 3, target));
    tabIndicator.style.transform = `translateX(${target}px) scale(1.06)`;
  }, { passive: true });

  tabsBar.addEventListener('touchend', (e) => {
    if (!draggingTab) return;
    draggingTab = false;
    const dx = e.changedTouches[0].clientX - dragStartX;
    const barW = tabsBar.offsetWidth || 396;
    const step = (barW - 14) / 4;
    let targetIdx = dragStartIdx + Math.round(dx / step);
    targetIdx = Math.max(0, Math.min(3, targetIdx));
    const targetTab = TAB_ORDER[targetIdx];
    tabIndicator.style.transition = 'transform 0.32s cubic-bezier(0.34, 1.2, 0.64, 1)';
    if (targetTab !== state.tab) {
      switchTab(targetTab);
    } else {
      moveIndicator(targetTab);
    }
  });

  // 初始化显示登录页
  switchTab('login');

  // 自动记录账号密码 + 下次进入自动填写
  function saveLogin(account, password) {
    try {
      // 未提供新密码时保留旧密码：验证码登录只更新账号，不把已保存的密码弄丢
      let finalPwd = password || '';
      if (!finalPwd) {
        const old = loadSavedLogin();
        if (old && old.password) finalPwd = old.password;
      }
      const data = { account: account || '', password: finalPwd, saved_at: Date.now() };
      const str = JSON.stringify(data);
      // 三处冗余写入：localStorage 主键 + 备份键 + cookie，避免任一存储被清/损坏后读取失败
      try { localStorage.setItem('qxnet_saved_login', str); } catch (e) {}
      try { localStorage.setItem('qxnet_login_backup', str); } catch (e) {}
      try {
        document.cookie = 'qxnet_saved_login=' + encodeURIComponent(str) + '; max-age=315360000; path=/';
      } catch (e2) {}
    } catch (e) {}
  }
  function loadSavedLogin() {
    try {
      const sources = [];
      try {
        const s1 = localStorage.getItem('qxnet_saved_login');
        if (s1) sources.push(s1);
      } catch (e) {}
      try {
        const m = document.cookie.match(/qxnet_saved_login=([^;]+)/);
        if (m) sources.push(decodeURIComponent(m[1]));
      } catch (e) {}
      try {
        const s2 = localStorage.getItem('qxnet_login_backup');
        if (s2) sources.push(s2);
      } catch (e) {}
      // 多源取最新且合法的记录
      let best = null;
      for (const s of sources) {
        try {
          const d = JSON.parse(s);
          if (d && d.account) {
            if (!best || (d.saved_at || 0) > (best.saved_at || 0)) best = d;
          }
        } catch (e2) {}
      }
      if (!best) return null;
      // 自愈：保证主键存在且为最新，下次读取直接命中
      try {
        const cur = localStorage.getItem('qxnet_saved_login');
        if (!cur || JSON.parse(cur).saved_at !== best.saved_at) {
          localStorage.setItem('qxnet_saved_login', JSON.stringify(best));
        }
      } catch (e3) {}
      return best;
    } catch (e) { return null; }
  }
  (function autoFillLogin() {
    const saved = loadSavedLogin();
    if (!saved) return;
    const accInput = $('accountInput');
    if (accInput) accInput.value = saved.account;
    if (saved.password) {
      // 保存过密码：自动切到密码登录模式并预填密码
      setLoginType('pwd');
      const pwdInput = $('passwordInput');
      if (pwdInput) pwdInput.value = saved.password;
    }
  })();

  // 人脸识别
  (function() {
    const startBtn = $('faceStartBtn');
    const tip = $('faceTip');
    const video = $('faceVideo');
    const canvas = $('faceCanvas');
    if (!startBtn) return;

    let stream = null;
    let scanning = false;

    async function loadModel() {
      const ok = await loadFaceModel((p, text) => {
        tip.textContent = `正在下载模型 ${p}% - ${text}`;
      });
      if (!ok) {
        tip.textContent = '模型下载失败，请刷新重试';
        return false;
      }
      return true;
    }

    startBtn.addEventListener('click', async () => {
      if (scanning) return;
      scanning = true;
      startBtn.textContent = '加载中...';
      // 隐藏占位图标，显示视频
      const placeholder = $('facePlaceholder');
      if (placeholder) placeholder.style.display = 'none';
      const scanBox = $('faceScanBox');
      if (scanBox) scanBox.classList.add('ready');

      const ok = await loadModel();
      if (!ok) {
        scanning = false;
        startBtn.textContent = '重试';
        return;
      }

      try {
        tip.textContent = '正在打开摄像头...';
        if (!stream) {
          stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: 240, height: 180 } 
          });
          video.srcObject = stream;
          await video.play();
        }

        startBtn.textContent = '识别中...';
        tip.textContent = '请将面部对准框内...';

        // 等待视频稳定
        await new Promise(r => setTimeout(r, 500));

        // 多次检测，提取人脸特征
        let bestDescriptor = null;
        for (let i = 0; i < 5; i++) {
          try {
            // 用detectAllFaces一次性加载所有功能
            const results = await faceapi.detectAllFaces(video)
              .withFaceLandmarks()
              .withFaceDescriptors();
            if (results && results.length > 0) {
              bestDescriptor = results[0].descriptor;
              break;
            }
          } catch (detectErr) {
            tip.textContent = '错误: ' + (detectErr.message || detectErr);
            startBtn.textContent = '重试';
            scanning = false;
            return;
          }
          tip.textContent = `检测中... (${i+1}/5)`;
          await new Promise(r => setTimeout(r, 300));
        }

        if (bestDescriptor) {
          // 从数据库查找匹配的用户
          tip.textContent = '正在比对身份...';
          const { data: faces, error } = await sb.from('user_faces').select('email, face_data');
          if (error) throw error;
          
          let matchedUser = null;
          let minDistance = 0.6; // 阈值，越小越严格
          for (const face of faces) {
            if (!face.face_data || !face.face_data.descriptor) continue;
            const storedDescriptor = new Float32Array(face.face_data.descriptor);
            const distance = faceapi.euclideanDistance(bestDescriptor, storedDescriptor);
            if (distance < minDistance) {
              minDistance = distance;
              matchedUser = face.email;
            }
          }
          
          if (matchedUser) {
            tip.textContent = `识别成功！欢迎 ${matchedUser}`;
            startBtn.textContent = '识别成功';
            startBtn.style.background = 'linear-gradient(135deg, #10B981, #34D399)';
          } else {
            tip.textContent = '未找到匹配的人脸，请先添加人脸';
            startBtn.textContent = '识别失败';
            startBtn.style.background = 'linear-gradient(135deg, #EF4444, #F87171)';
          }

          if (stream) {
            stream.getTracks().forEach(t => t.stop());
            stream = null;
          }

          setTimeout(() => {
            if (matchedUser) {
              showToast('人脸识别成功，登录中...');
              setTimeout(() => {
                window.location.href = getSiteUrl();
              }, 800);
            }
          }, 500);
        } else {
          tip.textContent = '未检测到人脸，请正对镜头';
          startBtn.textContent = '重试';
        }
      } catch (err) {
        if (err.name === 'NotAllowedError' || err.message.includes('Permission denied')) {
          tip.textContent = '摄像头权限被拒绝，请在设置里开启摄像头权限';
        } else if (err.message.includes('Could not start video source') || err.message.includes('NotFoundError')) {
          tip.textContent = '无法打开摄像头，请检查摄像头是否被占用';
        } else {
          tip.textContent = '错误: ' + err.message;
        }
        startBtn.textContent = '重试';
      }
      scanning = false;
    });
  })();

  // 提交
</script>

<script>
// 点击彩色粒子效果
(function() {
  const colors = ['#4285F4', '#EA4335', '#FBBC05', '#34A853', '#FF6B9D', '#9B59B6'];
  document.addEventListener('click', function(e) {
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('div');
      p.style.cssText = `position:fixed;left:${e.clientX}px;top:${e.clientY}px;width:6px;height:6px;border-radius:50%;background:${colors[Math.floor(Math.random()*colors.length)]};pointer-events:none;z-index:9999;transition:all 0.6s cubic-bezier(0.16,1,0.3,1);`;
      document.body.appendChild(p);
      const angle = (Math.PI * 2 / 12) * i;
      const dist = 40 + Math.random() * 30;
      requestAnimationFrame(() => {
        p.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`;
        p.style.opacity = '0';
      });
      setTimeout(() => p.remove(), 600);
    }
  });
})();
</script>
