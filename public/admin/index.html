<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QXNET 管理后台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --ink:#0f172a; --sub:#64748b; --faint:#94a3b8;
    --line:rgba(15,23,42,.09);
    --brand:#2563eb; --brand2:#7c3aed;
    --brand-grad:linear-gradient(135deg,#2563eb,#7c3aed);
    --glass:rgba(255,255,255,.55);
    --glass-strong:rgba(255,255,255,.72);
    --glass-line:rgba(255,255,255,.65);
    --radius:20px;
    --shadow:0 12px 40px rgba(30,41,59,.12);
  }
  html,body { height:100%; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink); min-height:100vh; padding:0 0 90px;
    background:linear-gradient(160deg,#e0e7ff 0%,#f1f5ff 30%,#eef6ff 60%,#f3e8ff 100%);
    position:relative;
  }
  /* 背景光斑：为玻璃折射提供底色 */
  body::before, body::after, body .orb{
    content:""; position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none;
  }
  body::before{ width:520px; height:520px; top:-180px; right:-120px;
    background:radial-gradient(circle,rgba(124,58,237,.28),transparent 70%); }
  body::after{ width:460px; height:460px; bottom:-160px; left:-120px;
    background:radial-gradient(circle,rgba(37,99,235,.24),transparent 70%); }
  .orb{ width:380px; height:380px; top:30%; left:35%;
    background:radial-gradient(circle,rgba(56,189,248,.18),transparent 70%); }
  .wrap { max-width:1120px; margin:0 auto; padding:0 20px; position:relative; z-index:1; }

  /* 顶栏 液态玻璃 */
  .topbar {
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,.42); backdrop-filter:blur(28px) saturate(1.8) contrast(1.05);
    -webkit-backdrop-filter:blur(28px) saturate(1.8) contrast(1.05);
    border-bottom:1px solid rgba(255,255,255,.6);
  }
  .topbar-inner { max-width:1120px; margin:0 auto; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; }
  .brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:17px; letter-spacing:.2px; }
  .brand .logo {
    width:36px; height:36px; border-radius:12px; background:var(--brand-grad); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:17px;
    box-shadow:0 6px 16px rgba(79,70,229,.35);
  }
  .top-actions { display:flex; gap:12px; align-items:center; }

  /* 按钮 */
  .btn { border:1px solid rgba(255,255,255,.5); border-radius:12px; padding:10px 16px; font-size:14px; font-weight:600; cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease, color .2s ease; }
  .btn:active { transform:scale(.97); }
  .btn-primary { background:var(--brand-grad); color:#fff; border-color:transparent;
    box-shadow:0 6px 16px rgba(37,99,235,.30), inset 0 1px 0 rgba(255,255,255,.25); }
  .btn-primary:hover { box-shadow:0 8px 22px rgba(79,70,229,.40), inset 0 1px 0 rgba(255,255,255,.3); filter:brightness(1.05); }
  .btn-ghost { background:rgba(255,255,255,.4); color:#475569; backdrop-filter:blur(10px); }
  .btn-ghost:hover { background:rgba(255,255,255,.62); }
  .btn-danger { background:rgba(254,226,226,.55); color:#dc2626; backdrop-filter:blur(10px); }
  .btn-danger:hover { background:#fecaca; }
  .btn-sm { padding:7px 12px; font-size:13px; border-radius:10px; }

  /* 登录 */
  #loginView { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; position:relative; z-index:1; }
  .login-box {
    width:100%; max-width:400px; background:var(--glass-strong); backdrop-filter:blur(30px) saturate(1.7) contrast(1.04);
    -webkit-backdrop-filter:blur(30px) saturate(1.7) contrast(1.04);
    border:1px solid var(--glass-line); border-radius:28px; padding:40px 32px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.7); animation:rise .45s cubic-bezier(.22,1,.36,1);
  }
  .login-box .logo-big { width:56px; height:56px; border-radius:18px; background:var(--brand-grad); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:900; font-size:26px; margin-bottom:22px;
    box-shadow:0 10px 26px rgba(79,70,229,.35); }
  .login-box h1 { font-size:23px; margin-bottom:6px; letter-spacing:.2px; }
  .login-box p { color:var(--sub); font-size:14px; margin-bottom:26px; }
  .field { margin-bottom:16px; }
  .field label { display:block; font-size:13px; color:var(--sub); margin-bottom:7px; font-weight:500; }
  .field input {
    width:100%; padding:13px 15px; border:1px solid rgba(255,255,255,.6); border-radius:14px; font-size:15px; outline:none;
    background:rgba(255,255,255,.45); backdrop-filter:blur(10px); transition:border-color .2s, box-shadow .2s, background .2s;
  }
  .field input:focus { border-color:var(--brand); background:rgba(255,255,255,.7); box-shadow:0 0 0 4px rgba(37,99,235,.12); }

  /* Tabs 液态玻璃分段控件 */
  .tabs {
    display:inline-flex; gap:4px; margin:26px 0 20px; padding:5px; border-radius:18px;
    background:rgba(255,255,255,.38); border:1px solid rgba(255,255,255,.6);
    backdrop-filter:blur(24px) saturate(1.8) contrast(1.05); -webkit-backdrop-filter:blur(24px) saturate(1.8) contrast(1.05);
    box-shadow:0 8px 24px rgba(30,41,59,.10), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .tab { padding:9px 20px; border-radius:13px; color:var(--sub); font-size:14px; font-weight:600; cursor:pointer;
    transition:all .22s ease; }
  .tab:hover { color:var(--ink); background:rgba(255,255,255,.35); }
  .tab.active { background:var(--brand-grad); color:#fff;
    box-shadow:0 6px 16px rgba(37,99,235,.32), inset 0 1px 0 rgba(255,255,255,.3); }

  .card {
    background:var(--glass); backdrop-filter:blur(28px) saturate(1.7) contrast(1.04); -webkit-backdrop-filter:blur(28px) saturate(1.7) contrast(1.04);
    border:1px solid var(--glass-line); border-radius:var(--radius); padding:22px;
    box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.7);
    animation:rise .35s cubic-bezier(.22,1,.36,1);
  }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
  .toolbar input, .toolbar select {
    padding:11px 13px; border:1px solid rgba(255,255,255,.6); border-radius:12px; font-size:14px; outline:none;
    background:rgba(255,255,255,.45); backdrop-filter:blur(10px); transition:border-color .2s, box-shadow .2s, background .2s; color:var(--ink);
  }
  .toolbar input:focus, .toolbar select:focus { border-color:var(--brand); background:rgba(255,255,255,.7); box-shadow:0 0 0 4px rgba(37,99,235,.12); }
  .toolbar input { flex:1; min-width:160px; }

  /* 列表卡片 */
  .list { display:flex; flex-direction:column; gap:12px; }
  .item {
    background:rgba(255,255,255,.42); backdrop-filter:blur(20px) saturate(1.6) contrast(1.03);
    -webkit-backdrop-filter:blur(20px) saturate(1.6) contrast(1.03);
    border:1px solid rgba(255,255,255,.6); border-radius:18px; padding:16px;
    box-shadow:0 6px 20px rgba(30,41,59,.08), inset 0 1px 0 rgba(255,255,255,.6);
    animation:rise .3s cubic-bezier(.22,1,.36,1);
  }
  .item-top { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .item-title { font-weight:700; font-size:14.5px; word-break:break-all; min-width:0; }
  .item-side { display:flex; align-items:center; gap:6px; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
  .item-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px 16px; margin:2px 0 12px; }
  .kv { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .kv .k { font-size:11px; color:var(--faint); letter-spacing:.2px; }
  .kv .v { font-size:13px; color:var(--ink); word-break:break-all; line-height:1.4; }
  .item-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .mono { font-family:ui-monospace,Menlo,Consolas,monospace; }

  .badge { display:inline-flex; align-items:center; gap:6px; padding:4px 11px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; backdrop-filter:blur(8px); }
  .badge::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .b-active { background:rgba(220,252,231,.6); color:#16a34a; }
  .b-expired { background:rgba(254,243,199,.6); color:#d97706; }
  .b-banned { background:rgba(254,226,226,.6); color:#dc2626; }
  .b-used { background:rgba(241,245,249,.6); color:#64748b; }
  .b-free { background:rgba(219,234,254,.6); color:#2563eb; }

  .muted { color:var(--faint); font-size:12px; }
  .empty { text-align:center; color:var(--faint); padding:48px 0; font-size:14px; }

  /* 弹窗 */
  .modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.4); backdrop-filter:blur(8px); z-index:100;
    display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-mask.show { display:flex; animation:fade .2s ease; }
  .modal { background:rgba(255,255,255,.72); backdrop-filter:blur(30px) saturate(1.7); -webkit-backdrop-filter:blur(30px) saturate(1.7);
    border:1px solid rgba(255,255,255,.7); border-radius:26px; padding:28px 26px; width:100%; max-width:390px;
    box-shadow:0 24px 60px rgba(15,23,42,.25), inset 0 1px 0 rgba(255,255,255,.7); animation:pop .28s cubic-bezier(.22,1,.36,1); }
  .modal h3 { font-size:18px; margin-bottom:18px; }
  .modal .field:last-of-type { margin-bottom:24px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; }

  .toast { position:fixed; left:50%; bottom:42px; transform:translateX(-50%) translateY(12px); background:#0f172a; color:#fff;
    padding:11px 20px; border-radius:14px; font-size:14px; font-weight:500; opacity:0; transition:all .25s ease; z-index:200;
    box-shadow:0 10px 30px rgba(15,23,42,.3); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .hidden { display:none !important; }

  .gen-result { background:rgba(255,255,255,.4); border:1px solid rgba(255,255,255,.6); backdrop-filter:blur(12px); border-radius:16px; padding:16px; margin-top:16px; max-height:180px; overflow:auto; }
  .gen-result .code { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; padding:5px 0; color:#334155; }

  .copy-btn { display:inline-flex; align-items:center; gap:5px; border:1px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.4); backdrop-filter:blur(8px); color:var(--brand); border-radius:8px;
    padding:4px 9px; font-size:12px; font-weight:600; cursor:pointer; transition:all .15s ease; }
  .copy-btn:hover { background:rgba(255,255,255,.65); }
  .copy-btn:active { transform:scale(.95); }
  .copy-btn svg { width:13px; height:13px; }

  @media (min-width:720px){ .item-grid{ grid-template-columns:repeat(3,1fr); } }
  @media (max-width:560px){
    .wrap{ padding:0 14px; }
    .card{ padding:16px; }
    .toolbar{ gap:8px; }
    .toolbar input{ min-width:120px; }
    .item{ padding:14px; }
    .item-title{ font-size:14px; }
  }

  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pop { from { opacity:0; transform:scale(.94) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:rgba(15,23,42,.18); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(15,23,42,.28); }
</style>
</head>
<body>
<div class="orb"></div>

<!-- 登录视图 -->
<div id="loginView">
  <div class="login-box">
    <div class="logo-big">Q</div>
    <h1>QXNET 管理后台</h1>
    <p>请输入管理员账号登录</p>
    <div class="field">
      <label>账号</label>
      <input id="loginUser" autocomplete="off" placeholder="管理员账号">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="loginPass" type="password" placeholder="管理员密码">
    </div>
    <button class="btn btn-primary" style="width:100%" id="loginBtn">登 录</button>
  </div>
</div>

<!-- 主视图 -->
<div id="mainView" class="hidden">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="logo">Q</div>QXNET 管理后台</div>
      <div class="top-actions">
        <span class="muted" id="adminName"></span>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <div class="tab active" data-tab="users">用户管理</div>
      <div class="tab" data-tab="cards">授权码</div>
      <div class="tab" data-tab="records">记录查看</div>
    </div>

    <!-- 用户 -->
    <section id="tab-users" class="card">
      <div class="toolbar">
        <input id="userSearch" placeholder="搜索邮箱 / 卡密 / 设备号">
        <button class="btn btn-primary btn-sm" id="refreshUsers">刷新</button>
      </div>
      <div class="list" id="userBody"></div>
      <div class="empty hidden" id="userEmpty">暂无用户</div>
    </section>

    <!-- 卡密 -->
    <section id="tab-cards" class="card hidden">
      <div class="toolbar">
        <select id="cardType">
          <option value="day">天卡（1 天）</option>
          <option value="week">周卡（7 天）</option>
          <option value="month" selected>月卡（30 天）</option>
          <option value="quarter">季卡（90 天）</option>
          <option value="lifetime">永久卡</option>
        </select>
        <input id="cardCount" type="number" min="1" max="500" value="10" style="max-width:120px">
        <button class="btn btn-primary btn-sm" id="genCards">批量生成</button>
        <button class="btn btn-ghost btn-sm" id="refreshCards">刷新</button>
      </div>
      <div class="gen-result hidden" id="genResult"></div>
      <div class="list" id="cardBody"></div>
      <div class="empty hidden" id="cardEmpty">暂无卡密</div>
    </section>

    <!-- 记录 -->
    <section id="tab-records" class="card hidden">
      <div class="toolbar">
        <select id="recordType">
          <option value="messages">留言消息</option>
          <option value="chat_messages">聊天记录</option>
          <option value="visits">设备访问</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="refreshRecords">刷新</button>
      </div>
      <div class="list" id="recordBody"></div>
      <div class="empty hidden" id="recordEmpty">暂无记录</div>
    </section>
  </div>
</div>

<!-- 重置密码弹窗 -->
<div class="modal-mask" id="resetModal">
  <div class="modal">
    <h3>重置用户密码</h3>
    <div class="field"><label>用户邮箱</label><div class="mono" id="resetEmail"></div></div>
    <div class="field"><label>新密码（8 位及以上）</label><input id="resetPwd" type="password" placeholder="输入新密码"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="resetCancel">取消</button>
      <button class="btn btn-primary" id="resetConfirm">确认重置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let currentTab = 'users';
let resetTarget = null;

const BASE = 'https://gngcducutevgllbaejec.supabase.co/functions/v1/admin-api';
let token = localStorage.getItem('admin_token') || '';

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(BASE + path, { ...opts, headers });
  if (res.status === 401) {
    token = ''; localStorage.removeItem('admin_token');
    showLogin(); throw new Error('未登录');
  }
  return res.json();
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2000);
}

// ===== 登录 / 登出 =====
function showLogin() {
  $('loginView').classList.remove('hidden');
  $('mainView').classList.add('hidden');
}
function showMain() {
  $('loginView').classList.add('hidden');
  $('mainView').classList.remove('hidden');
  loadUsers();
}

$('loginBtn').onclick = async () => {
  const user = $('loginUser').value.trim(), pass = $('loginPass').value;
  if (!user || !pass) return toast('请输入账号和密码');
  const j = await api('/login', { method: 'POST', body: JSON.stringify({ user, password: pass }) });
  if (j.code === 0) {
    token = j.data.token; localStorage.setItem('admin_token', token);
    $('adminName').textContent = user; showMain();
  }
  else toast(j.msg || '登录失败');
};
$('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click(); });

$('logoutBtn').onclick = async () => {
  await api('/logout', { method: 'POST' });
  token = ''; localStorage.removeItem('admin_token');
  showLogin();
};

// ===== Tab 切换 =====
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    ['users', 'cards', 'records'].forEach(k => $('tab-' + k).classList.toggle('hidden', k !== currentTab));
    if (currentTab === 'cards') loadCards();
    if (currentTab === 'records') loadRecords();
  };
});

// ===== 用户 =====
const STATUS = { active:['b-active','正常'], expired:['b-expired','已过期'], banned:['b-banned','已封禁'] };
const TYPE_CN = { day:'天卡', week:'周卡', month:'月卡', quarter:'季卡', lifetime:'永久' };

async function loadUsers() {
  const q = $('userSearch').value.trim();
  const j = await api('/users' + (q ? '?search=' + encodeURIComponent(q) : ''));
  if (j.code !== 0) return toast(j.msg);
  const list = j.data || [];
  $('userBody').innerHTML = '';
  $('userEmpty').classList.toggle('hidden', list.length > 0);
  list.forEach(u => {
    const [cls, txt] = STATUS[u.status] || STATUS.active;
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-top">
        <div class="item-title mono">${esc(u.email)}</div>
        <span class="badge ${cls}">${txt}</span>
      </div>
      <div class="item-grid">
        <div class="kv"><span class="k">授权到期</span><span class="v">${u.expires_at ? esc(u.expires_at.slice(0,10)) : '-'}</span></div>
        <div class="kv"><span class="k">卡密</span><span class="v mono">${u.card_key ? esc(u.card_key) : '-'}</span></div>
        <div class="kv"><span class="k">设备号</span><span class="v mono">${u.device_id ? esc(u.device_id) : '-'}</span></div>
        <div class="kv"><span class="k">注册时间</span><span class="v">${u.created_at ? esc(u.created_at.slice(0,16).replace('T',' ')) : '-'}</span></div>
        <div class="kv"><span class="k">最后登录</span><span class="v">${u.last_sign_in_at ? esc(u.last_sign_in_at.slice(0,16).replace('T',' ')) : '-'}</span></div>
      </div>
      <div class="item-actions">
        <button class="btn btn-ghost btn-sm" data-act="reset" data-id="${u.id}" data-email="${esc(u.email)}">重置密码</button>
        <button class="btn btn-ghost btn-sm" data-act="ban" data-id="${u.id}" data-ban="${u.status==='banned'?0:1}">${u.status==='banned'?'解封':'封禁'}</button>
        <button class="btn btn-danger btn-sm" data-act="del" data-id="${u.id}">删除</button>
      </div>`;
    $('userBody').appendChild(el);
  });
}

$('userBody').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn) return;
  const { act, id, email, ban } = btn.dataset;
  if (act === 'reset') {
    resetTarget = id; $('resetEmail').textContent = email; $('resetPwd').value = '';
    $('resetModal').classList.add('show');
  } else if (act === 'ban') {
    const j = await api('/users/' + id + '/ban', { method: 'POST', body: JSON.stringify({ ban: ban === '1' }) });
    toast(j.msg); if (j.code === 0) loadUsers();
  } else if (act === 'del') {
    if (!confirm('确认删除该用户？此操作不可恢复')) return;
    const j = await api('/users/' + id, { method: 'DELETE' });
    toast(j.msg); if (j.code === 0) loadUsers();
  }
});

$('resetCancel').onclick = () => $('resetModal').classList.remove('show');
$('resetConfirm').onclick = async () => {
  const pwd = $('resetPwd').value;
  if (pwd.length < 8) return toast('新密码需 8 位及以上');
  const j = await api('/users/' + resetTarget + '/reset-password', { method: 'POST', body: JSON.stringify({ password: pwd }) });
  toast(j.msg);
  if (j.code === 0) $('resetModal').classList.remove('show');
};

$('refreshUsers').onclick = loadUsers;
$('userSearch').addEventListener('keydown', e => { if (e.key === 'Enter') loadUsers(); });

// ===== 卡密 =====
async function loadCards() {
  const j = await api('/cards');
  if (j.code !== 0) return toast(j.msg);
  const list = j.data || [];
  $('cardBody').innerHTML = '';
  $('cardEmpty').classList.toggle('hidden', list.length > 0);
  list.forEach(c => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `
      <div class="item-top">
        <div class="item-title mono">${esc(c.card_key)}</div>
        <div class="item-side">
          <span class="badge b-free">${TYPE_CN[c.type] || c.type}</span>
          <span class="badge ${c.used ? 'b-used' : 'b-active'}">${c.used ? '已使用' : '未使用'}</span>
        </div>
      </div>
      <div class="item-grid">
        <div class="kv"><span class="k">类型</span><span class="v">${TYPE_CN[c.type] || c.type}</span></div>
        <div class="kv"><span class="k">创建时间</span><span class="v">${c.created_at ? esc(c.created_at.slice(0,16).replace('T',' ')) : '-'}</span></div>
      </div>
      <div class="item-actions">
        <button class="copy-btn" data-key="${esc(c.card_key)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>
        ${c.used ? '' : `<button class="btn btn-danger btn-sm" data-id="${c.id}">作废</button>`}
      </div>`;
    $('cardBody').appendChild(el);
  });
}

$('cardBody').addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn) return;
  if (btn.classList.contains('copy-btn')) { copyText(btn.dataset.key); return; }
  if (!confirm('确认作废该卡密？')) return;
  const j = await api('/cards/' + btn.dataset.id + '/revoke', { method: 'POST' });
  toast(j.msg); if (j.code === 0) loadCards();
});

$('genCards').onclick = async () => {
  const type = $('cardType').value;
  const count = parseInt($('cardCount').value, 10) || 10;
  const j = await api('/cards/batch', { method: 'POST', body: JSON.stringify({ type, count }) });
  toast(j.msg);
  if (j.code === 0) {
    const box = $('genResult');
    box.classList.remove('hidden');
    box.innerHTML = (j.data || []).map(c => `<div class="code">${esc(c)}</div>`).join('');
    loadCards();
  }
};
$('refreshCards').onclick = loadCards;

// ===== 记录 =====
const RECORD_COLS = {
  messages: ['content', 'contact', 'device_id', 'created_at'],
  chat_messages: ['content', 'user_id', 'created_at'],
  visits: ['device_id', 'visited_at']
};
const RECORD_LABEL = { content:'内容', contact:'联系方式', device_id:'设备号', created_at:'时间', user_id:'用户', visited_at:'访问时间' };
async function loadRecords() {
  const type = $('recordType').value;
  const j = await api('/records?type=' + type);
  if (j.code !== 0) return toast(j.msg);
  const list = j.data || [];
  const cols = RECORD_COLS[type];
  $('recordBody').innerHTML = '';
  $('recordEmpty').classList.toggle('hidden', list.length > 0);
  list.forEach(r => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = `<div class="item-grid">${cols.map(c => {
      let v = r[c] != null ? esc(String(r[c])) : '-';
      if ((c === 'created_at' || c === 'visited_at') && r[c]) v = esc(String(r[c]).slice(0,16).replace('T',' '));
      return `<div class="kv"><span class="k">${RECORD_LABEL[c] || c}</span><span class="v mono">${v}</span></div>`;
    }).join('')}</div>`;
    $('recordBody').appendChild(el);
  });
}
$('refreshRecords').onclick = loadRecords;
$('recordType').onchange = loadRecords;

function copyText(t) {
  const done = () => toast('已复制：' + t);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
  } else fallbackCopy(t, done);
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (_) { toast('复制失败，请手动复制'); }
  ta.remove();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// 启动：校验现有会话
(async () => {
  try {
    const j = await api('/me');
    if (j.code === 0) { $('adminName').textContent = j.data.user; showMain(); }
  } catch (e) { showLogin(); }
})();
